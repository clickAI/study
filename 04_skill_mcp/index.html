  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"ko\"><head>\n<meta charset=\"utf-8\">\n<title>SKILL &amp; MCP<\u002Ftitle>\n<script src=\"459e3e3c-f542-4b30-83c8-755d0407a4a0\"><\u002Fscript>\n<style>\n  :root {\n    --fg: #111;\n    --fg-soft: #4a4a4a;\n    --fg-mute: #8a8a8a;\n    --bg: #ffffff;\n    --rule: #e6e6e6;\n    --accent: #c84b16;\n    --accent-soft: #fff7f2;\n    --accent-line: #f0d4be;\n    --cream: #faf8f5;\n    --cream2: #f1ede7;\n    --ink-dim: #b7b1a8;\n    --teal: #2f7d6b;\n    --font-kr: -apple-system, BlinkMacSystemFont, \"Apple SD Gothic Neo\", \"Pretendard\", \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n    --font-mono: ui-monospace, SFMono-Regular, \"SF Mono\", Menlo, Consolas, monospace;\n  }\n  *{ box-sizing: border-box; }\n  html, body { background: #111; margin: 0; }\n  deck-stage { background: #111; }\n\n  section {\n    background: var(--bg);\n    color: var(--fg);\n    font-family: var(--font-kr);\n    font-weight: 400;\n    letter-spacing: -0.01em;\n    padding: 80px 100px;\n    box-sizing: border-box;\n    position: relative;\n    overflow: hidden;\n    display: flex;\n    flex-direction: column;\n  }\n\n  .eyebrow { font-size: 21px; color: var(--fg-mute); letter-spacing: 0.02em; margin-bottom: 20px; font-weight: 500; }\n  .eyebrow .num { color: var(--accent); margin-right: 14px; font-variant-numeric: tabular-nums; }\n  h1.slide-title { font-size: 70px; font-weight: 700; line-height: 1.1; margin: 0 0 40px 0; letter-spacing: -0.025em; }\n  h1.slide-title .sub { color: var(--fg-mute); font-weight: 500; font-size: 0.56em; }\n  h2.section-sub { font-size: 32px; font-weight: 500; color: var(--fg-soft); margin: 0 0 36px 0; }\n\n  ul.bullets { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 22px; max-width: 1500px; }\n  ul.bullets li { font-size: 29px; line-height: 1.45; color: var(--fg); padding-left: 36px; position: relative; }\n  ul.bullets li::before { content: \"\"; width: 9px; height: 9px; border-radius: 50%; background: var(--fg); position: absolute; left: 6px; top: 16px; }\n  ul.bullets li.muted { color: var(--fg-mute); }\n  ul.bullets li.muted::before { background: var(--fg-mute); }\n  ul.bullets li b { color: var(--accent); font-weight: 600; }\n  ul.bullets.tight li { font-size: 26px; gap: 0; }\n  code, .mono { font-family: var(--font-mono); font-size: 0.84em; background: var(--cream2); padding: 2px 8px; border-radius: 4px; }\n\n  .footer { position: absolute; bottom: 34px; left: 100px; right: 100px; display: flex; justify-content: space-between; align-items: center; font-size: 17px; color: var(--fg-mute); font-variant-numeric: tabular-nums; }\n  .footer .brand { letter-spacing: 0.04em; }\n  .footer .pageno .total { color: #c8c8c8; }\n\n  .twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; flex: 1; }\n  .twocol.top { align-items: start; }\n  .twocol.w7 { grid-template-columns: 1.15fr 0.85fr; }\n  .twocol > .right { align-self: stretch; display: flex; align-items: center; justify-content: center; }\n\n  /* cover */\n  .cover { justify-content: center; align-items: flex-start; padding-left: 130px; }\n  .cover .kicker { font-family: var(--font-mono); font-size: 20px; color: var(--fg-mute); letter-spacing: 0.08em; margin-bottom: 40px; }\n  .cover h1 { font-size: 150px; font-weight: 700; margin: 0; line-height: 0.98; letter-spacing: -0.04em; display: flex; align-items: baseline; gap: 36px; }\n  .cover h1 .amp { color: var(--fg-mute); font-weight: 400; font-size: 0.62em; }\n  .cover h1 .mcp { color: var(--accent); }\n  .cover .subtitle { margin-top: 52px; font-size: 27px; color: var(--fg-soft); max-width: 980px; line-height: 1.5; }\n  .cover .meta { position: absolute; bottom: 78px; left: 130px; right: 130px; display: flex; justify-content: space-between; align-items: flex-end; color: var(--fg-mute); font-size: 18px; font-family: var(--font-mono); letter-spacing: 0.04em; }\n\n  /* divider */\n  .divider { justify-content: center; align-items: flex-start; padding-left: 130px; }\n  .divider .chap { font-family: var(--font-mono); font-size: 21px; color: var(--accent); letter-spacing: 0.12em; margin-bottom: 32px; }\n  .divider h1 { font-size: 108px; font-weight: 700; margin: 0; line-height: 1.05; letter-spacing: -0.03em; }\n  .divider .desc { margin-top: 36px; font-size: 25px; color: var(--fg-soft); max-width: 1150px; line-height: 1.5; }\n\n  .stage { width: 100%; background: var(--cream); border: 1px solid var(--rule); border-radius: 8px; position: relative; overflow: hidden; }\n\n  /* three-up */\n  .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 8px; }\n  .three .card { border: 1px solid var(--rule); border-radius: 10px; padding: 28px 26px; background: #fff; display: flex; flex-direction: column; gap: 12px; }\n  .three .card .kk { font-family: var(--font-mono); font-size: 14px; color: var(--fg-mute); letter-spacing: 0.06em; }\n  .three .card .ttl { font-size: 30px; font-weight: 700; }\n  .three .card .lead { font-size: 20px; color: var(--fg-soft); line-height: 1.5; }\n  .three .card .ex { margin-top: auto; font-family: var(--font-mono); font-size: 14px; color: var(--fg-mute); background: var(--cream); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; line-height: 1.5; }\n  .three .card.hot { border-color: var(--accent); background: var(--accent-soft); }\n  .three .card.hot .ttl { color: var(--accent); }\n  .three .card.hot .ex { background: #fff; }\n\n  /* static context bar */\n  .ctxbar { width: 100%; height: 88px; border: 2px solid var(--fg); border-radius: 6px; display: flex; overflow: hidden; background: #fff; }\n  .ctxbar .seg { display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 15px; color: #333; border-right: 1px solid rgba(0,0,0,0.18); white-space: nowrap; }\n  .ctxbar .sys { background: var(--accent-line); width: 14%; }\n  .ctxbar .mem { background: var(--cream2); width: 12%; }\ 710\" y=\"60\" font-family=\"-apple-system,sans-serif\" font-size=\"16\" font-weight=\"600\" fill=\"#111\">MCP Server<\u002Ftext>\n        <text x=\"710\" y=\"82\" font-family=\"ui-monospace,Menlo\" font-size=\"12\" fill=\"#888\">🗄 데이터베이스 — Tools · Resources · Prompts 제공<\u002Ftext>\n        <rect x=\"690\" y=\"106\" width=\"470\" height=\"62\" rx=\"8\" fill=\"#fff\" stroke=\"#111\"><\u002Frect>\n        <text x=\"710\" y=\"132\" font-family=\"-apple-system,sans-serif\" font-size=\"16\" font-weight=\"600\" fill=\"#111\">MCP Server<\u002Ftext>\n        <text x=\"710\" y=\"154\" font-family=\"ui-monospace,Menlo\" font-size=\"12\" fill=\"#888\">📁 파일시스템 — Tools · Resources · Prompts 제공<\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <ul class=\"bullets tight\" style=\"gap:16px;\">\n      <li><b>Host<\u002Fb> — 사용자가 쓰는 앱. 내부에 여러 <b>Client<\u002Fb>를 둠<\u002Fli>\n      <li><b>Client<\u002Fb> — 서버 하나와 1:1로 연결을 관리(능력 탐색·호출). <b>Server<\u002Fb> — 능력을 제공하는 프로그램<\u002Fli>\n      <li class=\"muted\">메시지는 <code>JSON-RPC 2.0<\u002Fcode> 규약 · 연결은 초기화(initialize) → 능력 교환 → 사용 → 종료<\u002Fli>\n    <\u002Ful>\n    <div class=\"footer\"><span class=\"brand\">SKILL &amp; MCP<\u002Fspan><span class=\"pageno\">15<span class=\"total\"> / 24<\u002Fspan><\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 16 3 primitives -->\n  <section data-screen-label=\"16 Tools Resources Prompts\">\n    <div class=\"eyebrow\"><span class=\"num\">11<\u002Fspan>MCP<\u002Fdiv>\n    <h1 class=\"slide-title\">서버가 제공하는 세 가지<\u002Fh1>\n    <div class=\"three\">\n      <div class=\"card hot\">\n        <div class=\"kk\">모델이 호출<\u002Fdiv>\n        <div class=\"ttl\">Tools<\u002Fdiv>\n        <div class=\"lead\"><b>실행하는 동작.<\u002Fb> 인자를 받아 일을 수행하고 결과를 돌려줌. 부작용 있음.<\u002Fdiv>\n        <div class=\"ex\">query(sql)<br>send_email(to, body)<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"kk\">앱이 읽음<\u002Fdiv>\n        <div class=\"ttl\">Resources<\u002Fdiv>\n        <div class=\"lead\">읽기 전용 <b>데이터.<\u002Fb> 파일·레코드·문서. 부작용 없는 조회(GET 같은).<\u002Fdiv>\n        <div class=\"ex\">file:///docs/readme.md<br>db://orders/schema<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"kk\">사용자가 부름<\u002Fdiv>\n        <div class=\"ttl\">Prompts<\u002Fdiv>\n        <div class=\"lead\">재사용 <b>템플릿·워크플로.<\u002Fb> 슬래시 명령처럼 사용자가 골라 실행.<\u002Fdiv>\n        <div class=\"ex\">/summarize-pr<br>/weekly-report<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"quotebox\" style=\"margin-top:36px;\">\n      외우는 법 — <b style=\"color:var(--accent);\">Resources는 조회하고, Tools는 실행하고, Prompts는 표준화한다.<\u002Fb>\n    <\u002Fdiv>\n    <div class=\"footer\"><span class=\"brand\">SKILL &amp; MCP<\u002Fspan><span class=\"pageno\">16<span class=\"total\"> / 24<\u002Fspan><\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 17 MCP DEMO -->\n  <section data-screen-label=\"17 MCP 데모 (Interactive)\">\n    <div class=\"eyebrow\"><span class=\"num\">12<\u002Fspan>MCP · 직접 보기<\u002Fdiv>\n    <h1 class=\"slide-title\" style=\"margin-bottom:20px;\">직접 보기 — Tool 호출의 왕복<\u002Fh1>\n    <div class=\"demo\" id=\"mcpDemo\">\n      <div class=\"demo-head\">\n        <div class=\"dt\"><span class=\"deyebrow\">MCP TOOL CALL · INTERACTIVE<\u002Fspan><span class=\"dtitle\">tools/list → tools/call → 결과만 회수<\u002Fspan><\u002Fdiv>\n        <div class=\"btns\"><button class=\"btn btn-run\" data-act=\"run\">▶ RUN<\u002Fbutton><button class=\"btn\" data-act=\"step\">STEP ▸<\u002Fbutton><button class=\"btn\" data-act=\"reset\">RESET<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"demo-body\">\n        <div class=\"log\">\n          <div class=\"logline\" data-step=\"1\"><span class=\"k\">①<\u002Fspan><span>에이전트: \"지난달 주문 합계 알려줘\"<\u002Fspan><\u002Fdiv>\n          <div class=\"logline\" data-step=\"2\"><span class=\"k\">②<\u002Fspan><span>tools/list — 서버가 가진 도구 목록 요청<\u002Fspan><\u002Fdiv>\n          <div class=\"logline\" data-step=\"3\"><span class=\"k\">←<\u002Fspan><span>query · insert · schema (3개 도구)<\u002Fspan><\u002Fdiv>\n          <div class=\"logline\" data-step=\"4\"><span class=\"k\">③<\u002Fspan><span>tools/call: query(\"SELECT sum(amount) …\")<\u002Fspan><\u002Fdiv>\n          <div class=\"logline\" data-step=\"5\"><span class=\"k\">④<\u002Fspan><span>서버 실행: 주문 10만 행 집계 → 1줄 반환<\u002Fspan><\u002Fdiv>\n          <div class=\"logline\" data-step=\"6\"><span class=\"k\">⑤<\u002Fspan><span>컨텍스트엔 결과 한 줄만 — 전체 DB는 안 들어옴<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"mcpwrap\">\n          <div class=\"mcp-nodes\">\n            <div class=\"mcp-node agent\"><div class=\"mh\">에이전트<\u002Fdiv><div class=\"ms\">Host · Client<\u002Fdiv><\u002Fdiv>\n            <div class=\"mcp-node server\">\n              <div class=\"mh\">DB 서버<\u002Fdiv><div class=\"ms\">MCP Server<\u002Fdiv>\n              <div class=\"db\"><span>🗄 orders<\u002Fspan><span class=\"rows\">100,000 행<\u002Fspan><\u002Fdiv>\n              <div class=\"tools\"><span class=\"tool t-query\">query<\u002Fspan><span class=\"tool\">insert<\u002Fspan><span class=\"tool\">schema<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"track\"><div class=\"packet\">요청<\u002Fdiv><\u002Fdiv>\n          <div class=\"ctxbox\"><div class=\"cl\">컨텍스트에 들어온 것<\u002Fdiv><div class=\"cv\">(아직 비어 있음)<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stepdots\"><span>STEP<\u002Fspan><span class=\"sd\"><\u002Fspan><span class=\"sd\"><\u002Fspan><span class=\"sd\"><\u002Fspan><span class=\"sd\"><\u002Fspan><span class=\"sd\"><\u002Fspan><span class=\"sd\"><\u002Fspan><span class=\"phase\" style=\"margin-left:auto;\">0 / 6 · 대기<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer\"><span class=\"brand\">SKILL &amp; MCP<\u002Fspan><span class=\"pageno\">17<span class=\"total\"> / 24<\u002Fspan><\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 18 양방향 · 보안 -->\n  <section data-screen-label=\"18 양방향과 보안\">\n    <div class=\"eyebrow\"><span class=\"num\">13<\u002Fspan>MCP<\u002Fdiv>\n    <h1 class=\"slide-title\">쓸 때 알아둘 것 <span class=\"sub\">— 양방향 · 보안<\u002Fspan><\u002Fh1>\n    <div class=\"twocol top\">\n      <div>\n        <h2 class=\"section-sub\" style=\"font-size:26px;margin-bottom:18px;color:var(--fg);font-weight:600;\">서버 → 에이전트로도 요청한다<\u002Fh2>\n        <ul class=\"bullets tight\" style=\"gap:14px;\">\n          <li><b>roots<\u002Fb> — 클라이언트가 접근 가능한 폴더 범위를 알려줌<\u002Fli>\n          <li><b>sampling<\u002Fb> — 서버가 거꾸로 LLM에게 <b>생성<\u002Fb>을 요청<\u002Fli>\n          <li><b>elicitation<\u002Fb> — 서버가 진행 중 <b>사용자에게 입력<\u002Fb>을 요청<\u002Fli>\n          <li class=\"muted\">→ 단방향 호출이 아니라, 사람을 끼워 넣을 수 있는 양방향 대화<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div>\n        <h2 class=\"section-sub\" style=\"font-size:26px;margin-bottom:18px;color:var(--fg);font-weight:600;\">연결은 곧 신뢰의 문제<\u002Fh2>\n        <ul class=\"bullets tight\" style=\"gap:14px;\">\n          <li>도구 설명도 <b>LLM이 읽는 텍스트<\u002Fb> — 악성 설명이 곧 프롬프트 주입<\u002Fli>\n          <li>도구 호출 전 <b>사용자 동의<\u002Fb>를 받는 게 원칙<\u002Fli>\n          <li>원격 서버는 <code>OAuth<\u002Fcode>로 인증, 권한은 최소로<\u002Fli>\n          <li class=\"muted\">서버 설치 = 소프트웨어 설치 — 출처를 신뢰할 수 있어야<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer\"><span class=\"brand\">SKILL &amp; MCP<\u002Fspan><span class=\"pageno\">18<span class=\"total\"> / 24<\u002Fspan><\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 19 synthesis -->\n  <section data-screen-label=\"19 SKILL과 MCP는 함께\">\n    <div class=\"eyebrow\"><span class=\"num\">14<\u002Fspan>MCP · 종합<\u002Fdiv>\n    <h1 class=\"slide-title\">둘은 경쟁이 아니라 짝<\u002Fh1>\n    <div class=\"twocol\" style=\"gap:48px;\">\n      <div class=\"stage\" style=\"padding:30px 32px;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:18px;\">\n        <div style=\"font-family:var(--font-mono);font-size:14px;color:var(--accent);letter-spacing:0.08em;\">MCP<\u002Fdiv>\n        <div style=\"font-size:26px;font-weight:600;\">능력을 연결한다<\u002Fdiv>\n        <div style=\"font-size:19px;color:var(--fg-soft);line-height:1.5;\">DB 서버를 꽂으면 <code>query<\u002Fcode> 도구가 생긴다.<\u002Fdiv>\n        <hr style=\"border:none;border-top:1px solid var(--rule);margin:6px 0;\">\n        <div style=\"font-family:var(--font-mono);font-size:14px;color:var(--accent);letter-spacing:0.08em;\">SKILL<\u002Fdiv>\n        <div style=\"font-size:26px;font-weight:600;\">방법을 담는다<\u002Fdiv>\n        <div style=\"font-size:19px;color:var(--fg-soft);line-height:1.5;\">\"월간 매출은 이 쿼리로, 이 형식으로 보고하라\"는 각본.<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <ul class=\"bullets\">\n          <li><b>MCP<\u002Fb> 없이 SKILL만 있으면 — 각본은 있지만 손발이 없음<\u002Fli>\n          <li><b>SKILL<\u002Fb> 없이 MCP만 있으면 — 도구는 많지만 잘 쓰는 법이 없음<\u002Fli>\n          <li>실제로 좋은 셋업은 <b>둘을 겹쳐<\u002Fb> 쓴다<\u002Fli>\n          <li class=\"muted\">그리고 둘 다 같은 규율을 따른다 — 다음 파트의 주제<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer\"><span class=\"brand\">SKILL &amp; MCP<\u002Fspan><span class=\"pageno\">19<span class=\"total\"> / 24<\u002Fspan><\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 24 마무리 -->\n  <section data-screen-label=\"24 마무리\" class=\"divider\">\n    <div class=\"chap\">정리<\u002Fdiv>\n    <h1 style=\"font-size:84px;\">한 가지만<br>기억한다면<\u002Fh1>\n    <p class=\"desc\" style=\"font-size:29px;max-width:1250px;\">\n      <b style=\"color:var(--accent);font-weight:600;\">MCP는 능력을, SKILL은 방법을 — 둘 다 필요한 만큼만, 결과 위주로.<\u002Fb><br>\n      한정된 기억 공간을 아끼면서 에이전트를 더 멀리 보내는 두 축입니다.\n    <\u002Fp>\n    <div class=\"footer\"><span class=\"brand\">SKILL &amp; MCP<\u002Fspan><span class=\"pageno\">24<span class=\"total\"> / 24<\u002Fspan><\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdeck-stage>\n\n<script>\n(function () {\n  function makeDemo(rootId, total, applyStep, opts) {\n    var root = document.getElementById(rootId);\n    if (!root) return;\n    opts = opts || {};\n    var step = 0, timer = null;\n    var dots = root.querySelectorAll('.stepdots .sd');\n    var phase = root.querySelector('.stepdots .phase');\n    function render() {\n      applyStep(root, step);\n      dots.forEach(function (d, i) { d.classList.toggle('on', i < step); });\n      if (phase) phase.textContent = step + ' / ' + total + (step === 0 ? ' · 대기' : (step >= total ? ' · 완료' : ' · 진행'));\n      var stepBtn = root.querySelector('[data-act=\"step\"]');\n      if (stepBtn) stepBtn.disabled = step >= total;\n    }\n    function go(n) { step = Math.max(0, Math.min(total, n)); render(); }\n    function stop() { if (timer) { clearInterval(timer); timer = null; } }\n    function run() {\n      stop();\n      if (step >= total) go(0);\n      timer = setInterval(function () { if (step >= total) { stop(); return; } go(step + 1); }, opts.interval || 1500);\n    }\n    root.querySelector('[data-act=\"run\"]').addEventListener('click', run);\n    root.querySelector('[data-act=\"step\"]').addEventListener('click', function () { stop(); go(step + 1); });\n    root.querySelector('[data-act=\"reset\"]').addEventListener('click', function () { stop(); go(0); });\n    render();\n    return { reset: function () { stop(); go(0); }, root: root };\n  }\n\n  function setLog(root, step) {\n    root.querySelectorAll('.logline').forEach(function (l) {\n      var s = +l.getAttribute('data-step');\n      l.classList.toggle('active', s === step);\n      l.classList.toggle('past', s < step);\n    });\n  }\n\n  var skillDemo = makeDemo('skillDemo', 5, function (root, step) {\n    setLog(root, step);\n    var pdf = root.querySelector('[data-skill=\"pdf\"]');\n    var web = root.querySelector('[data-skill=\"web\"]');\n    var rev = root.querySelector('[data-skill=\"rev\"]');\n    var note = root.querySelector('.demo-note');\n    var mBody = root.querySelector('.m-body');\n    var mOut = root.querySelector('.m-out');\n    var muse = root.querySelector('.muse');\n    [pdf, web, rev].forEach(function (s) { s.classList.remove('dim', 'match', 'open', 'l3on'); });\n    note.classList.remove('show');\n    if (step >= 2) { pdf.classList.add('match'); web.classList.add('dim'); rev.classList.add('dim'); }\n    if (step >= 3) { pdf.classList.add('open'); }\n    if (step >= 4) { pdf.classList.add('l3on'); }\n    if (step >= 5) { note.classList.add('show'); }\n    mBody.style.width = step >= 3 ? '20%' : '0%';\n    mOut.style.width = step >= 4 ? '10%' : '0%';\n    var usage = 5 + (step >= 3 ? 20 : 0) + (step >= 4 ? 10 : 0);\n    muse.textContent = step === 0 ? '대기' : (usage + '% 사용');\n  });\n\n  var mcpDemo = makeDemo('mcpDemo', 6, function (root, step) {\n    setLog(root, step);\n    var pkt = root.querySelector('.packet');\n    var tools = root.querySelector('.tools');\n    var qtool = root.querySelector('.t-query');\n    var db = root.querySelector('.db');\n    var ctx = root.querySelector('.ctxbox');\n    var cv = root.querySelector('.ctxbox .cv');\n    tools.classList.remove('show');\n    qtool.classList.remove('sel');\n    db.classList.remove('exec');\n    ctx.classList.remove('filled');\n    pkt.classList.remove('show', 'atServer', 'resp');\n    if (step === 2) { pkt.classList.add('show', 'atServer'); pkt.textContent = 'tools/list →'; }\n    else if (step === 3) { pkt.classList.add('show', 'resp'); pkt.textContent = '← 도구 3개'; }\n    else if (step === 4) { pkt.classList.add('show', 'atServer'); pkt.textContent = 'query(…) →'; }\n    else if (step === 5) { pkt.classList.add('show', 'resp'); pkt.textContent = '← 결과 1줄'; }\n    if (step >= 3) tools.classList.add('show');\n    if (step >= 4) qtool.classList.add('sel');\n    if (step >= 5) db.classList.add('exec');\n    if (step >= 6) { ctx.classList.add('filled'); cv.textContent = '주문 합계: ₩42,300,000'; }\n    else { cv.textContent = '(아직 비어 있음)'; }\n  });\n\n  [skillDemo, mcpDemo].forEach(function (dm) {\n    if (!dm || !dm.root) return;\n    var sec = dm.root.closest('section');\n    if (!sec) return;\n    new MutationObserver(function () {\n      if (!sec.hasAttribute('data-deck-active')) dm.reset();\n    }).observe(sec, { attributes: true, attributeFilter: ['data-deck-active'] });\n  });\n})();\n\n  // auto-number footers from slide order so inserting slides never breaks paging\n  (function () {\n    var slides = document.querySelectorAll('deck-stage > section');\n    var total = slides.length;\n    slides.forEach(function (s, i) {\n      var p = s.querySelector('.pageno');\n      if (p) p.innerHTML = String(i + 1).padStart(2, '0') + '<span class=\"total\"> / ' + total + '<\u002Fspan>';\n    });\n    var sc = document.querySelector('.cover .meta span:last-child');\n    if (sc) sc.textContent = total + ' SLIDES';\n    var counts = {};\n    document.querySelectorAll('deck-stage > section .eyebrow .num').forEach(function (num) {\n      var eye = num.closest('.eyebrow');\n      var key = (eye.textContent || '').replace(num.textContent, '').split('·')[0].trim();\n      counts[key] = (counts[key] || 0) + 1;\n      num.textContent = String(counts[key]).padStart(2, '0');\n    });\n  })();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
