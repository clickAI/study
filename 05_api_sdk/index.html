  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"ko\"><head>\n<meta charset=\"utf-8\">\n<title>비용 · API · Agent SDK<\u002Ftitle>\n<script src=\"643e98b5-d781-4bf7-bd9d-c0b65e210377\"><\u002Fscript>\n<style>\n  :root {\n    --fg: #111;\n    --fg-soft: #4a4a4a;\n    --fg-mute: #8a8a8a;\n    --bg: #ffffff;\n    --rule: #e6e6e6;\n    --accent: #c84b16;\n    --accent-soft: #fff7f2;\n    --accent-line: #f0d4be;\n    --cream: #faf8f5;\n    --cream2: #f1ede7;\n    --ink-dim: #b7b1a8;\n    --teal: #2f7d6b;\n    --font-kr: -apple-system, BlinkMacSystemFont, \"Apple SD Gothic Neo\", \"Pretendard\", \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n    --font-mono: ui-monospace, SFMono-Regular, \"SF Mono\", Menlo, Consolas, monospace;\n  }\n  *{ box-sizing: border-box; }\n  html, body { background: #111; margin: 0; }\n  deck-stage { background: #111; }\n\n  section {\n    background: var(--bg);\n    color: var(--fg);\n    font-family: var(--font-kr);\n    font-weight: 400;\n    letter-spacing: -0.01em;\n    padding: 80px 100px;\n    box-sizing: border-box;\n    position: relative;\n    overflow: hidden;\n    display: flex;\n    flex-direction: column;\n  }\n\n  .eyebrow { font-size: 21px; color: var(--fg-mute); letter-spacing: 0.02em; margin-bottom: 20px; font-weight: 500; }\n  .eyebrow .num { color: var(--accent); margin-right: 14px; font-variant-numeric: tabular-nums; }\n  h1.slide-title { font-size: 70px; font-weight: 700; line-height: 1.1; margin: 0 0 40px 0; letter-spacing: -0.025em; }\n  h1.slide-title .sub { color: var(--fg-mute); font-weight: 500; font-size: 0.56em; }\n  h2.section-sub { font-size: 32px; font-weight: 500; color: var(--fg-soft); margin: 0 0 36px 0; }\n\n  ul.bullets { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 22px; max-width: 1500px; }\n  ul.bullets li { font-size: 29px; line-height: 1.45; color: var(--fg); padding-left: 36px; position: relative; }\n  ul.bullets li::before { content: \"\"; width: 9px; height: 9px; border-radius: 50%; background: var(--fg); position: absolute; left: 6px; top: 16px; }\n  ul.bullets li.muted { color: var(--fg-mute); }\n  ul.bullets li.muted::before { background: var(--fg-mute); }\n  ul.bullets li b { color: var(--accent); font-weight: 600; }\n  ul.bullets.tight li { font-size: 26px; gap: 0; }\n  code, .mono { font-family: var(--font-mono); font-size: 0.84em; background: var(--cream2); padding: 2px 8px; border-radius: 4px; }\n\n  .footer { position: absolute; bottom: 34px; left: 100px; right: 100px; display: flex; justify-content: space-between; align-items: center; font-size: 17px; color: var(--fg-mute); font-variant-numeric: tabular-nums; }\n  .footer .brand { letter-spacing: 0.04em; }\n  .footer .pageno .total { color: #c8c8c8; }\n\n  .twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; flex: 1; }\n  .twocol.top { align-items: start; }\n  .twocol.w7 { grid-template-columns: 1.15fr 0.85fr; }\n  .twocol > .right { align-self: stretch; display: flex; align-items: center; justify-content: center; }\n\n  /* cover */\n  .cover { justify-content: center; align-items: flex-start; padding-left: 130px; }\n  .cover .kicker { font-family: var(--font-mono); font-size: 20px; color: var(--fg-mute); letter-spacing: 0.08em; margin-bottom: 40px; }\n  .cover h1 { font-size: 130px; font-weight: 700; margin: 0; line-height: 0.98; letter-spacing: -0.04em; display: flex; align-items: baseline; gap: 30px; flex-wrap: wrap; }\n  .cover h1 .amp { color: var(--fg-mute); font-weight: 400; font-size: 0.5em; }\n  .cover h1 .mcp { color: var(--accent); }\n  .cover .subtitle { margin-top: 48px; font-size: 27px; color: var(--fg-soft); max-width: 1020px; line-height: 1.5; }\n  .cover .meta { position: absolute; bottom: 78px; left: 130px; right: 130px; display: flex; justify-content: space-between; align-items: flex-end; color: var(--fg-mute); font-size: 18px; font-family: var(--font-mono); letter-spacing: 0.04em; }\n\n  /* divider */\n  .divider { justify-content: center; align-items: flex-start; padding-left: 130px; }\n  .divider .chap { font-family: var(--font-mono); font-size: 21px; color: var(--accent); letter-spacing: 0.12em; margin-bottom: 32px; }\n  .divider h1 { font-size: 100px; font-weight: 700; margin: 0; line-height: 1.05; letter-spacing: -0.03em; }\n  .divider .desc { margin-top: 36px; font-size: 25px; color: var(--fg-soft); max-width: 1150px; line-height: 1.5; }\n\n  .stage { width: 100%; background: var(--cream); border: 1px solid var(--rule); border-radius: 8px; position: relative; overflow: hidden; }\n\n  /* three-up */\n  .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 8px; }\n  .three .card { border: 1px solid var(--rule); border-radius: 10px; padding: 28px 26px; background: #fff; display: flex; flex-direction: column; gap: 12px; }\n  .three .card .kk { font-family: var(--font-mono); font-size: 14px; color: var(--fg-mute); letter-spacing: 0.06em; }\n  .three .card .ttl { font-size: 30px; font-weight: 700; }\n  .three .card .lead { font-size: 20px; color: var(--fg-soft); line-height: 1.5; }\n  .three .card .ex { margin-top: auto; font-family: var(--font-mono); font-size: 14px; color: var(--fg-mute); background: var(--cream); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; line-height: 1.5; }\n  .three .card.hot { border-color: var(--accent); background: var(--accent-soft); }\n  .three .card.hot .ttl { color: var(--accent); }\n  .three .card.hot .ex { background: #fff; }\n\n  .ctx-caption { margin-top: 28px; font-size: 23px; color: var(--fg-soft); }\n  .ctx-caption b { color: var(--accent); font-weight: 600; }\n\n  /* directory tree */\n  .tree { font-family: var(--font-mono); font-size: 21px; line-height: 1.85; color: var(--fg-soft); }\n  .tree .dir { color: var(--accent); font-weight: 600; }\n  .tree .req { color: var(--fg); font-weight: 600; }\n  .tree .cmt { color: var(--fg-mute); }\n\n  /* static levels */\n  .levels { display: flex; flex-direction: column; gap: 16px; width: 100%; }\n  .lvl { border: 1.5px solid var(--rule); border-radius: 10px; padding: 20px 24px; background: #fff; display: flex; align-items: center; gap: 22px; }\n  .lvl .ln { font-family: var(--font-mono); font-size: 14px; color: var(--fg-mute); letter-spacing: 0.06em; width: 88px; flex-shrink: 0; }\n  .lvl .lbody { flex: 1; }\n  .lvl .lh { font-size: 24px; font-weight: 600; margin-bottom: 3px; }\n  .lvl .ld { font-size: 18px; color: var(--fg-soft); line-height: 1.45; }\n  .lvl .ld b { color: var(--accent); font-weight: 600; }\n  .lvl .state { font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.04em; padding: 6px 14px; border-radius: 999px; flex-shrink: 0; background: var(--cream2); color: var(--fg-mute); }\n  .lvl .cost { font-family: var(--font-mono); font-size: 13px; color: var(--fg-mute); width: 118px; flex-shrink: 0; text-align: right; }\n  .lvl.on { border-color: var(--accent); background: var(--accent-soft); }\n  .lvl.on .lh { color: var(--accent); }\n  .lvl.on .state { background: var(--accent); color: #fff; }\n\n  /* decision / compare table */\n  .cmp { width: 100%; border-collapse: collapse; font-size: 22px; margin-top: 6px; }\n  .cmp th, .cmp td { text-align: left; padding: 18px 22px; border-bottom: 1px solid var(--rule); vertical-align: top; }\n  .cmp thead th { font-size: 16px; font-family: var(--font-mono); letter-spacing: 0.06em; color: var(--fg-mute); text-transform: uppercase; font-weight: 600; }\n  .cmp tbody th { font-weight: 700; font-size: 24px; width: 220px; color: var(--accent); font-family: var(--font-mono); }\n  .cmp td { color: var(--fg-soft); line-height: 1.45; }\n  .cmp td.ex { font-family: var(--font-mono); font-size: 16px; color: var(--fg-mute); }\n  .cmp .cap { font-family: var(--font-mono); font-size: 15px; color: var(--fg-mute); }\n  .cmp .price { font-family: var(--font-mono); font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }\n\n  /* one-line conclusion */\n  .bigquote { font-size: 44px; line-height: 1.4; font-weight: 600; letter-spacing: -0.02em; max-width: 1500px; color: var(--fg); }\n  .bigquote b { color: var(--accent); }\n  .quote-src { margin-top: 32px; font-family: var(--font-mono); font-size: 17px; color: var(--fg-mute); letter-spacing: 0.04em; }\n\n  .quotebox { border-left: 4px solid var(--accent); padding: 14px 22px; background: var(--cream); border-radius: 0 4px 4px 0; font-size: 21px; color: var(--fg-soft); line-height: 1.5; }\n  .quotebox .src { display:block; margin-top: 8px; font-family: var(--font-mono); font-size: 14px; color: var(--fg-mute); }\n\n  /* ════════════ INTERACTIVE DEMO ════════════ */\n  .demo { flex: 1; display: flex; flex-direction: column; gap: 18px; border: 1px solid var(--rule); border-radius: 10px; background: var(--cream); padding: 28px 32px; }\n  .demo-head { display: flex; justify-content: space-between; align-items: center; }\n  .demo-head .dt { display: flex; flex-direction: column; gap: 4px; }\n  .demo-head .deyebrow { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.1em; color: var(--fg-mute); }\n  .demo-head .dtitle { font-size: 23px; font-weight: 600; color: var(--fg); }\n  .btns { display: flex; gap: 10px; }\n  .btn { font-family: var(--font-mono); font-size: 15px; letter-spacing: 0.05em; padding: 10px 18px; border-radius: 6px; cursor: pointer; border: 1px solid var(--rule); background: #fff; color: var(--fg); }\n  .btn-run { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }\n  .btn-run:hover { filter: brightness(1.05); }\n  .btn:disabled { opacity: 0.4; cursor: default; }\n\n  .demo-body { flex: 1; display: grid; grid-template-columns: 0.95fr 1.05fr; gap: 22px; min-height: 0; }\n  .log { background: #fff; border: 1px solid var(--rule); border-radius: 8px; padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }\n  .log .logline { font-family: var(--font-mono); font-size: 17px; line- ink: 0; }\n  .tog.on { border-color: var(--accent); background: var(--accent-soft); }\n  .tog.on .box { background: var(--accent); border-color: var(--accent); }\n  .tog.on .tgn { color: var(--accent); }\n  .calc-result { border-left: 1px solid var(--rule); padding-left: 26px; display: flex; flex-direction: column; justify-content: center; gap: 18px; }\n  .calc-result .rk { font-family: var(--font-mono); font-size: 13px; color: var(--fg-mute); letter-spacing: 0.06em; }\n  .calc-result .rbig { font-size: 60px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.02em; }\n  .calc-result .rbig .cur { font-size: 0.5em; color: var(--fg-mute); font-weight: 500; }\n  .calc-result .rsub { font-size: 20px; color: var(--fg-soft); }\n  .calc-result .rsub b { color: var(--fg); font-variant-numeric: tabular-nums; }\n  .costbar { height: 34px; border: 1.5px solid var(--fg); border-radius: 5px; display: flex; overflow: hidden; background: #fff; }\n  .costbar .cseg { height: 100%; transition: width .4s cubic-bezier(.22,1,.36,1); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11px; color: #fff; white-space: nowrap; overflow: hidden; }\n  .costbar .c-in { background: var(--accent-line); color: #7a4a2c; }\n  .costbar .c-out { background: var(--accent); }\n  .barlegend { display: flex; gap: 18px; font-family: var(--font-mono); font-size: 13px; color: var(--fg-soft); }\n  .barlegend span::before { content:\"\"; display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:6px; vertical-align: middle; }\n  .barlegend .lin::before { background: var(--accent-line); }\n  .barlegend .lout::before { background: var(--accent); }\n  .savenote { font-size: 16px; color: var(--teal); font-weight: 600; min-height: 22px; }\n\n  /* connector / synthesis panel */\n  .ba { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; flex: 1; }\n  .ba .panel { border: 1px solid var(--rule); border-radius: 10px; background: #fff; padding: 26px 28px; display: flex; flex-direction: column; gap: 16px; }\n  .ba .panel.good { border-color: var(--accent); background: var(--accent-soft); }\n  .ba .panel .pl { font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.06em; color: var(--fg-mute); }\n  .ba .panel.good .pl { color: var(--accent); }\n  .ba .panel .verdict { margin-top: auto; font-size: 20px; font-weight: 600; }\n  .ba .panel .verdict.bad { color: var(--fg-mute); }\n  .ba .panel .verdict.ok { color: var(--accent); }\n\n  /* mini chat window (API concept) */\n  .cwin { border: 1.5px solid var(--rule); border-radius: 9px; background: #fff; overflow: hidden; }\n  .cwin .cbar { background: var(--cream2); font-family: var(--font-mono); font-size: 13px; color: var(--fg-mute); padding: 8px 13px; display: flex; justify-content: space-between; align-items: center; }\n  .cwin .cbody { padding: 14px; display: flex; flex-direction: column; gap: 9px; }\n  .cwin .msg { font-size: 15px; padding: 8px 13px; border-radius: 10px; max-width: 82%; line-height: 1.35; }\n  .cwin .msg.me { align-self: flex-end; background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--fg-soft); }\n  .cwin .msg.ai { align-self: flex-start; background: var(--cream2); color: var(--fg-mute); }\n  .codecard { border: 1px solid var(--rule); border-radius: 9px; background: #fff; overflow: hidden; }\n  .codecard .cbar { background: #141413; color: #d8d3ca; font-family: var(--font-mono); font-size: 13px; padding: 9px 14px; }\n  .codecard .cbody { padding: 16px 18px; font-family: var(--font-mono); font-size: 15px; line-height: 1.7; color: var(--fg-soft); }\n  .codecard .cbody .kw { color: var(--accent); }\n  .codecard .cbody .st { color: var(--teal); }\n  .codecard .cbody .cm { color: var(--fg-mute); }\n\n  /* growing context turns */\n  .turns { display: flex; flex-direction: column; gap: 12px; width: 100%; }\n  .turnrow { display: flex; align-items: center; gap: 16px; }\n  .turnrow .tlab { font-family: var(--font-mono); font-size: 14px; color: var(--fg-mute); width: 80px; flex-shrink: 0; }\n  .turnrow .tbar { flex: 1; height: 30px; border-radius: 5px; background: var(--cream2); overflow: hidden; display: flex; }\n  .turnrow .tbar .fill { height: 100%; background: var(--accent-line); }\n  .turnrow .tbar .fill.new { background: var(--accent); }\n  .turnrow .tcost { font-family: var(--font-mono); font-size: 14px; color: var(--fg); width: 92px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }\n<\u002Fstyle>\n<\u002Fhead>\n\n\n\n<body>\n<deck-stage>\n\n  <!-- 01 Cover -->\n  <section data-screen-label=\"01 표지\" class=\"cover\">\n    <div class=\"kicker\">STUDY · 05<\u002Fdiv>\n    <h1><span>claude<\u002Fspan><span class=\"mcp\">-p<\u002Fspan><\u002Fh1>\n    <p class=\"subtitle\">Claude Code를 명령 한 줄로 자동 실행하는 <b style=\"color:var(--fg);font-weight:600;\">claude -p<\u002Fb> — 그 아래에 깔린 두 가지를 먼저 봅니다: 모델을 부르는 방법(<b style=\"color:var(--fg);font-weight:600;\">API<\u002Fb>)과 그 사용 요금(<b style=\"color:var(--fg);font-weight:600;\">비용<\u002Fb>).<\u002Fp>\n    <div class=\"meta\"><span>스터디 발표 · 2026<\u002Fspan><span>20 SLIDES<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 02 오늘의 지도 -->\n  <section data-screen-label=\"02 오늘의 지도\">\n    <div class=\"eyebrow\">오늘 다룰 내용<\u002Fdiv>\n    <h1 class=\"slide-title\" style=\"margin-bottom:34px;\">세 가지 주제<\u002Fh1>\n    <div class=\"three\">\n      <div class=\"card\">\n        <div class=\"kk\">모델을 부르는 방법<\u002Fdiv>\n        <div class=\"ttl\">API<\u002Fdiv>\n        <div class=\"lead\">프로그램이 모델을 호출하는 <b>통로<\u002Fb>. 채팅 화면이 아니라 코드로 요청·응답을 주고받는다.<\u002Fdiv>\n        <div class=\"ex\">요청 → 응답<br>토큰 단위로 계량<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"kk\">사용 요금<\u002Fdiv>\n        <div class=\"ttl\">비용<\u002Fdiv>\n        <div class=\"lead\">쓴 만큼 낸다. 주고받은 <b>토큰<\u002Fb>이 곧 요금이며, 줄일 방법이 여럿 있다.<\u002Fdiv>\n        <div class=\"ex\">input · output 토큰<br>캐시 · 배치 할인<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card hot\">\n        <div class=\"kk\">작업을 자동 실행 · 핵심 주제<\u002Fdiv>\n        <div class=\"ttl\">claude -p<\u002Fdiv>\n        <div class=\"lead\">Claude Code를 <b>명령 한 줄로<\u002Fb> 실행 — 스스로 도구를 쓰고 반복하며 일을 끝까지 처리하고 결과만 출력한다.<\u002Fdiv>\n        <div class=\"ex\">claude -p \"...\"<br>gather → action → verify<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"quotebox\" style=\"margin-top:36px;\">이 순서로 다루는 이유는, <b style=\"color:var(--accent);\">에이전트가 API를 여러 번 반복 호출<\u002Fb>하고 그 반복이 그대로 <b style=\"color:var(--accent);\">비용<\u002Fb>으로 이어지기 때문입니다. 그래서 API·비용을 먼저 봅니다.<\u002Fdiv>\n    <div class=\"footer\"><span class=\"brand\">비용 · API · SDK<\u002Fspan><span class=\"pageno\"><\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 03 PART 01 divider -->\n  <section data-screen-label=\"03 PART 01 API와 비용\" class=\"divider\">\n    <div class=\"chap\">PART 01 · API &amp; 비용<\u002Fdiv>\n    <h1>API와 비용<\u002Fh1>\n    <p class=\"desc\">에이전트의 <span style=\"color:var(--accent);font-weight:600;\">기반이자 비용 구조<\u002Fspan>. 모델을 코드로 호출하는 방식과, 요금이 어떻게 계산되고 어떻게 줄일 수 있는지를 봅니다.<\u002Fp>\n    <div class=\"footer\"><span class=\"brand\">비용 · API · SDK<\u002Fspan><span class=\"pageno\"><\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 04 일반적인 API -->\n  <section data-screen-label=\"04 API란 무엇인가\">\n    <div class=\"eyebrow\"><span class=\"num\">01<\u002Fspan>API<\u002Fdiv>\n    <h1 class=\"slide-title\">API — <span class=\"sub\">프로그램끼리 약속된 방식으로 주고받기<\u002Fspan><\u002Fh1>\n    <div class=\"twocol\">\n      <div>\n        <ul class=\"bullets\">\n          <li>API는 한 프로그램이 다른 프로그램의 <b>기능·데이터를 가져다 쓰는 창구<\u002Fb><\u002Fli>\n          <li>사람이 아니라 <b>프로그램끼리<\u002Fb> 서로 요청하고 응답한다<\u002Fli>\n          <li>요청과 응답의 <b>형식이 미리 약속<\u002Fb>되어 있어 서로 알아듣는다<\u002Fli>\n          <li class=\"muted\">예: 날씨 앱은 기상청 API로 날씨를, 지도 앱은 지도 API로 위치를 가져온다<\u002Fli>\n        <\u002Ful>\n        <div class=\"quotebox\" style=\"margin-top:30px;\">즉 API는 프로그램들이 서로 <b style=\"color:var(--accent);\">정해진 방식으로 대화하는 창구<\u002Fb>입니다. 다음 장에서는 이 API로 LLM 서비스를 부르는 경우를 봅니다.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"right\">\n        <div class=\"stage\" style=\"padding:36px 34px;display:flex;flex-direction:column;gap:24px;justify-content:center;\">\n          <div style=\"font-family:var(--font-mono);font-size:13px;color:var(--fg-mute);letter-spacing:.06em;\">요청과 응답의 흐름<\u002Fdiv>\n          <div style=\"display:flex;align-items:stretch;gap:12px;\">\n            <div style=\"flex:1;background:#fff;border:1.5px solid var(--rule);border-radius:9px;padding:16px 14px;text-align:center;\"><div style=\"font-size:19px;font-weight:700;\">내 프로그램<\u002Fdiv><div style=\"font-family:var(--font-mono);font-size:12px;color:var(--fg-mute);margin-top:4px;\">예: 날씨 앱<\u002Fdiv><\u002Fdiv>\n            <div style=\"align-self:center;color:var(--accent);font-size:24px;\">→<\u002Fdiv>\n            <div style=\"flex:1;background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:9px;padding:16px 14px;text-align:center;\"><div style=\"font-size:19px;font-weight:700;color:var(--accent);\">API<\u002Fdiv><div style=\"font-family:var(--font-mono);font-size:12px;color:var(--accent);margin-top:4px;\">정해진 창구<\u002Fdiv><\u002Fdiv>\n            <div style=\"align-self:center;color:var(--accent);font-size:24px;\">→<\u002Fdiv>\n            <div style=\"flex:1;background:#fff;border:1.5px solid var(--rule);border-radius:9px;padding:16px 14px;text-align:center;\"><div style=\"font-size:19px;font-weight:700;\">서비스 서버<\u002Fdiv><div style=\"font-family:var(--font-mono);font-size:12px;color:var(--fg-mute);margin-top:4px;\">예: 기상청<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;\">\n            <div style=\"display:flex;align-items:center;gap:12px;\"><span style=\"font-family:var(--font-mono);font-size:13px;color:var(--accent);width:64px;flex-shrink:0;\">① 요청<\u002Fspan><div style=\"flex:1;background:#fff;border:1px solid var(--rule);border-radius:6px;padding:10px 14px;font-family:var(--font-mono);font-size:14px;color:var(--fg-soft);\">\"서울 날씨 알려줘\"<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:12px;\"><span style=\"font-family:var(--font-mono);font-size:13px;color:var(--teal);width:64px;flex-shrink:0;\">② 응답<\u002Fspan><div style=\"flex:1;background:#fff;border:1px solid var(--rule);border-radius:6px;padding:10px 14px;font-family:var(--font-mono);font-size:14px;color:var(--fg-soft);\">{ 온도: 24, 하늘: \"맑음\" }<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer\"><span class=\"brand\">비용 · API · SDK<\u002Fspan><span class=\"pageno\"><\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 05 LLM 서비스의 API -->\n  <section data-screen-label=\"05 LLM 서비스의 API\">\n    <div class=\"eyebrow\"><span class=\"num\">02<\u002Fspan>API<\u002Fdiv>\n    <h1 class=\"slide-title\">LLM 서비스의 API <span class=\"sub\">— 코드로 모델을 호출한다<\u002Fspan><\u002Fh1>\n    <div class=\"twocol\">\n      <div>\n        <ul class=\"bullets\">\n          <li>채팅 앱은 <b>사람이<\u002Fb> 화면에서 직접 대화한다<\u002Fli>\n          <li>API는 <b>프로그램이<\u002Fb> 코드로 요청을 보내고 응답을 받는다<\u002Fli>\n          <li>매 요청은 그 자체로 완결 — 모델은 <b>보낸 내용만<\u002Fb> 본다<\u002Fli>\n          <li class=\"muted\">그래서 대화를 이어가려면 이전 내용을 매번 다시 담아 보낸다<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"right\">\n        <div class=\"stage\" style=\"padding:28px 30px;display:flex;flex-direction:column;gap:20px;justify-content:center;\">\n          <div>\n            <div style=\"font-family:var(--font-mono);font-size:13px;color:var(--fg-mute);letter-spacing:.06em;margin-bottom:10px;\">사람 — 채팅 앱<\u002Fdiv>\n            <div class=\"cwin\">\n              <div class=\"cbar\"><span>claude.ai<\u002Fspan><span>대화<\u002Fspan><\u002Fdiv>\n              <div class=\"cbody\">\n                <div class=\"msg me\">이번 주 매출 요약해줘<\u002Fdiv>\n                <div class=\"msg ai\">네, 이번 주 매출은…<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center;color:var(--accent);font-size:20px;font-family:var(--font-mono);\">같은 모델, 다른 호출 방식 ↓<\u002Fdiv>\n          <div>\n            <div style=\"font-family:var(--font-mono);font-size:13px;color:var(--accent);letter-spacing:.06em;margin-bottom:10px;\">프로그램 — API<\u002Fdiv>\n            <div class=\"codecard\">\n              <div class=\"cbar\">app.py<\u002Fdiv>\n              <div class=\"cbody\"><span class=\"cm\"># 코드가 모델을 호출<\u002Fspan><br>resp = client.messages.<span class=\"kw\">create<\u002Fspan>(<br>&nbsp;&nbsp;model=<span class=\"st\">\"claude-sonnet\"<\u002Fspan>,<br>&nbsp;&nbsp;messages=[<br>&nbsp;&nbsp;&nbsp;&nbsp;{ role: <span class=\"st\">\"user\"<\u002Fspan>,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;content: <span class=\"st\">\"이번 주 매출 요약해줘\"<\u002Fspan> }<br>&nbsp;&nbsp;]<br>)<br><br><span class=\"cm\"># resp.content →<\u002Fspan><br><span class=\"st\">\"이번 주 매출은 1,240만원으로<\u002Fspan><br><span class=\"st\">&nbsp;지난주 대비 8% 증가했습니다.\"<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer\"><span class=\"brand\">비용 · API · SDK<\u002Fspan><span class=\"pageno\"><\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 05 토큰이 곧 돈 -->\n  <section data-screen-label=\"05 토큰이 곧 돈\">\n    <div class=\"eyebrow\"><span class=\"num\">02<\u002Fspan>비용<\u002Fdiv>\n    <h1 class=\"slide-title\">토큰이 곧 비용 <span class=\"sub\">— 주고받은 만큼 계산된다<\u002Fspan><\u002Fh1>\n    <div class=\"twocol\">\n      <div>\n        <ul class=\"bullets\">\n          <li><b>토큰<\u002Fb>은 글자를 잘게 나눈 조각 — 대략 한글 1~2자, 영어 4글자쯤<\u002Fli>\n          <li>보낸 글(<b>input<\u002Fb>)과 받은 글(<b>output<\u002Fb>)을 <b>따로<\u002Fb> 센다<\u002Fli>\n          <li>대부분 모델에서 <b>output이 input의 5배<\u002Fb> 가격 — 길게 쓸수록 비싸다< =\"demo-body\">\n        <div class=\"log\">\n          <div class=\"logline\" data-step=\"1\"><span class=\"k\">▷<\u002Fspan><span>$ claude -p <b>\"결제 버그를 고쳐줘\"<\u002Fb><\u002Fspan><\u002Fdiv>\n          <div class=\"logline\" data-step=\"2\"><span class=\"k\">①<\u002Fspan><span>GATHER — 관련 파일·로그를 읽어 들임<\u002Fspan><\u002Fdiv>\n          <div class=\"logline\" data-step=\"3\"><span class=\"k\">②<\u002Fspan><span>ACTION — 원인으로 보이는 코드를 수정<\u002Fspan><\u002Fdiv>\n          <div class=\"logline\" data-step=\"4\"><span class=\"k\">③<\u002Fspan><span>VERIFY — 테스트 실행 → <b>실패<\u002Fb>, 아직 안 됨<\u002Fspan><\u002Fdiv>\n          <div class=\"logline\" data-step=\"5\"><span class=\"k\">↻<\u002Fspan><span>다시 GATHER·ACTION — 다른 원인을 수정<\u002Fspan><\u002Fdiv>\n          <div class=\"logline\" data-step=\"6\"><span class=\"k\">③<\u002Fspan><span>VERIFY — 테스트 실행 → <b>통과<\u002Fb><\u002Fspan><\u002Fdiv>\n          <div class=\"logline\" data-step=\"7\"><span class=\"k\">✓<\u002Fspan><span>목표 달성 → 루프 종료<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"loopwrap\">\n          <div class=\"loopnodes\">\n            <div class=\"loopnode\" data-node=\"gather\"><div class=\"lk\">STEP 1<\u002Fdiv><div class=\"lt\">Gather<\u002Fdiv><div class=\"ls\">맥락 모으기<\u002Fdiv><\u002Fdiv>\n            <div class=\"loopnode\" data-node=\"action\"><div class=\"lk\">STEP 2<\u002Fdiv><div class=\"lt\">Action<\u002Fdiv><div class=\"ls\">도구 실행<\u002Fdiv><\u002Fdiv>\n            <div class=\"loopnode\" data-node=\"verify\"><div class=\"lk\">STEP 3<\u002Fdiv><div class=\"lt\">Verify<\u002Fdiv><div class=\"ls\">결과 검증<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"gate\" id=\"gate\"><span class=\"gicon\">?<\u002Fspan><span id=\"gatetext\">목표 달성 여부를 확인 중…<\u002Fspan><\u002Fdiv>\n          <div class=\"loopmeta\">\n            <div class=\"lm\"><div class=\"lmk\">루프 반복<\u002Fdiv><div class=\"lmv acc\" id=\"loopcount\">0<\u002Fdiv><\u002Fdiv>\n            <div class=\"lm\"><div 3줄로 요약\"<\u002Fspan> \\<br>&nbsp;&nbsp;--output-format json \\<br>&nbsp;&nbsp;--max-turns 5 \\<br>&nbsp;&nbsp;&gt; <span class=\"st\">result.json<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer\"><span class=\"brand\">비용 · API · SDK<\u002Fspan><span class=\"pageno\"><\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 16 subagent 병렬 -->\n  <section data-screen-label=\"16 claude -p 자동화 활용\">\n    <div class=\"eyebrow\"><span class=\"num\">12<\u002Fspan>claude -p<\u002Fdiv>\n    <h1 class=\"slide-title\">어디에 쓰나 <span class=\"sub\">— 사람 없이 도는 자동화<\u002Fspan><\u002Fh1>\n    <div class=\"three\">\n      <div class=\"card\">\n        <div class=\"kk\">CI/CD<\u002Fdiv>\n        <div class=\"ttl\">코드 리뷰·수정<\u002Fdiv>\n        <div class=\"lead\">PR이 올라올 때마다 <b>자동으로<\u002Fb> 코드를 검토하고 버그를 고친다.<\u002Fdiv>\n        <div class=\"ex\">GitHub Action<br>+ claude -p<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"kk\">예약 · 배치<\u002Fdiv>\n        <div class=\"ttl\">야간 일괄 처리<\u002Fdiv>\n        <div class=\"lead\">밤사이 로그 정리·문서 요약처럼 <b>정해진 일<\u002Fb>을 무인으로 돌린다.<\u002Fdiv>\n        <div class=\"ex\">cron + claude -p<br>대량 처리<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"kk\">파이프라인<\u002Fdiv>\n        <div class=\"ttl\">데이터 가공<\u002Fdiv>\n        <div class=\"lead\">추출·분류·변환 <b>한 단계<\u002Fb>로 끼워 넣어 다음 명령에 넘긴다.<\u002Fdiv>\n        <div class=\"ex\">cat … | claude -p<br>| 다음 단계<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"quotebox\" style=\"margin-top:36px;\">핵심은 <b style=\"color:var(--accent);\">\"터미널에서 하던 그 일을, 사람 없이 그대로\"<\u002Fb> — 대화형으로 검증한 작업을 명령 한 줄로 자동화합니다.<\u002Fdiv>\n    <div class=\"footer\"><span class=\"brand\">비용 · API · SDK<\u002Fspan><span class=\"pageno\"><\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 17 세션 컨텍스트 관리 -->\n  <section data-screen-label=\"17 claude -p 무상태와 세션\">\n    <div class=\"eyebrow\"><span class=\"num\">13<\u002Fspan>claude -p<\u002Fdiv>\n    <h1 class=\"slide-title\">한 번 실행하고 끝 <span class=\"sub\">— 이어하려면 세션을 잇는다<\u002Fspan><\u002Fh1>\n    <div class=\"twocol\">\n      <div>\n        <ul class=\"bullets\">\n          <li><code>claude -p<\u002Fcode>는 <b>한 번 실행 후 종료<\u002Fb> — 기본적으로 상태를 남기지 않는다<\u002Fli>\n          <li>그래서 다음 실행은 <b>이전 대화를 기억하지 못한다<\u002Fb><\u002Fli>\n          <li>이어서 작업하려면 <code>--resume<\u002Fcode>·<code>-c<\u002Fcode>로 <b>세션을 잇는다<\u002Fb><\u002Fli>\n          <li class=\"muted\">무상태가 기본이라 <b>자동화·병렬 실행<\u002Fb>에 다루기 쉽다<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"right\">\n        <div class=\"stage\" style=\"padding:32px;display:flex;flex-direction:column;gap:24px;justify-content:center;\">\n          <div>\n            <div style=\"font-family:var(--font-mono);font-size:13px;color:var(--fg-mute);letter-spacing:.06em;margin-bottom:10px;\">① 그냥 실행 — 매번 새로 시작<\u002Fdiv>\n            <div class=\"codecard\">\n              <div class=\"cbody\" style=\"font-size:14px;\">$ claude <span class=\"kw\">-p<\u002Fspan> <span class=\"st\">\"인증 모듈 읽어\"<\u002Fspan><br><span class=\"cm\"># 실행 후 종료 · 기억 없음<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:var(--font-mono);font-size:13px;color:var(--accent);letter-spacing:.06em;margin-bottom:10px;\">② 이어하기 — 세션을 잇는다<\u002Fdiv>\n            <div class=\"codecard\" style=\"border-color:var(--accent);\">\n              <div class=\"cbody\" style=\"font-size:14px;\">$ claude <span class=\"kw\">-p<\u002Fspan> <span class=\"kw\">-c<\u002Fspan> <span class=\"st\">\"그걸 호출하는 곳 찾아\"<\u002Fspan><br><span class=\"cm\"># 이전 세션 이어받아 계속<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer\"><span class=\"brand\">비용 · API · SDK<\u002Fspan><span class=\"pageno\"><\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 18 비용 × 에이전트 (연결) -->\n  <section data-screen-label=\"18 비용과 에이전트 연결\">\n    <div class=\"eyebrow\"><span class=\"num\">14<\u002Fspan>claude -p · 종합<\u002Fdiv>\n    <h1 class=\"slide-title\">claude -p 한 번이 <span class=\"sub\">비용을 배가시킨다<\u002Fspan><\u002Fh1>\n    <div class=\"twocol\">\n      <div>\n        <ul class=\"bullets\">\n          <li>루프가 한 번 돌 때마다 <b>API가 다시 호출<\u002Fb>된다<\u002Fli>\n          <li>매 호출에 <b>지금까지의 맥락 전체<\u002Fb>가 다시 실린다 — 반복 청구<\u002Fli>\n          <li>그래서 PART 01의 지렛대가 여기서 <b>결정적<\u002Fb>이 된다<\u002Fli>\n          <li class=\"muted\">쉬운 판단은 Haiku로 · 반복 맥락은 캐시로 · 급하지 않으면 배치로<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"right\">\n        <div class=\"stage\" style=\"padding:30px 34px;display:flex;flex-direction:column;gap:16px;justify-content:center;\">\n          <div style=\"font-family:var(--font-mono);font-size:13px;color:var(--fg-mute);letter-spacing:.06em;\">한 작업 = 루프 여러 번 = API 여러 번<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap;\">\n            <div style=\"background:#fff;border:1px solid var(--rule);border-radius:6px;padding:8px 12px;font-family:var(--font-mono);font-size:13px;color:var(--fg-soft);\">호출 1<\u002Fdiv>\n            <span style=\"color:var(--accent);\">+<\u002Fspan>\n            <div style=\"background:#fff;border:1px solid var(--rule);border-radius:6px;padding:8px 14px;font-family:var(--font-mono);font-size:13px;color:var(--fg-soft);\">호출 2<\u002Fdiv>\n            <span style=\"color:var(--accent);\">+<\u002Fspan>\n            <div style=\"background:#fff;border:1px solid var(--rule);border-radius:6px;padding:8px 16px;font-family:var(--font-mono);font-size:13px;color:var(--fg-soft);\">호출 3<\u002Fdiv>\n            <span style=\"color:var(--accent);\">+<\u002Fspan>\n            <div style=\"background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:8px 20px;font-family:var(--font-mono);font-size:13px;color:var(--accent);\">호출 N …<\u002Fdiv>\n          <\u002Fdiv>\n          <hr style=\"border:none;border-top:1px solid var(--rule);margin:6px 0;\">\n          <div style=\"display:flex;gap:12px;\">\n            <div style=\"flex:1;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:8px;padding:14px 16px;\"><div style=\"font-size:18px;font-weight:700;color:var(--accent);\">캐시<\u002Fdiv><div style=\"font-size:14px;color:var(--fg-soft);margin-top:3px;\">반복 맥락 –90%<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:8px;padding:14px 16px;\"><div style=\"font-size:18px;font-weight:700;color:var(--accent);\">모델 라우팅<\u002Fdiv><div style=\"font-size:14px;color:var(--fg-soft);margin-top:3px;\">쉬운 건 Haiku<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer\"><span class=\"brand\">비용 · API · SDK<\u002Fspan><span class=\"pageno\"><\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 19 종합 -->\n  <section data-screen-label=\"19 핵심 요약\">\n    <div class=\"eyebrow\">종합<\u002Fdiv>\n    <h1 class=\"slide-title\">핵심 요약<\u002Fh1>\n    <p class=\"bigquote\"><b>API<\u002Fb>는 모델을 호출하는 통로, <b>비용<\u002Fb>은 토큰으로 계산되는 요금, <b>claude -p<\u002Fb>는 그 둘 위에서 Claude Code를 명령 한 줄로 자동 실행하는 방법이다.<\u002Fp>\n    <p class=\"quote-src\">— 자동화를 잘 설계한다는 것은, 반복(루프)을 줄이며 목표에 도달하는 것<\u002Fp>\n    <div class=\"footer\"><span class=\"brand\">비용 · API · SDK<\u002Fspan><span class=\"pageno\"><\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 20 마무리 -->\n  <section data-screen-label=\"20 마무리\" class=\"divider\">\n    <div class=\"chap\">정리<\u002Fdiv>\n    <h1 style=\"font-size:80px;\">핵심 한 가지<\u002Fh1>\n    <p class=\"desc\" style=\"font-size:29px;max-width:1250px;\">\n      <b style=\"color:var(--accent);font-weight:600;\">claude -p 한 번은 API를 여러 번 반복 호출하고, 그 반복이 곧 비용이다.<\u002Fb><br>\n      따라서 저렴한 모델·캐시·배치로 반복 비용을 줄이는 것이 핵심입니다.\n    <\u002Fp>\n    <div class=\"footer\"><span class=\"brand\">비용 · API · SDK<\u002Fspan><span class=\"pageno\"><\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdeck-stage>\n\n<script>\n(function () {\n  /* ---------- generic stepper for the loop demo ---------- */\n  function makeDemo(rootId, total, applyStep, opts) {\n    var root = document.getElementById(rootId);\n    if (!root) return;\n    opts = opts || {};\n    var step = 0, timer = null;\n    var dots = root.querySelectorAll('.stepdots .sd');\n    var phase = root.querySelector('.stepdots .phase');\n    function render() {\n      applyStep(root, step);\n      dots.forEach(function (d, i) { d.classList.toggle('on', i < step); });\n      if (phase) phase.textContent = step + ' / ' + total + (step === 0 ? ' · 대기' : (step >= total ? ' · 완료' : ' · 진행'));\n      var stepBtn = root.querySelector('[data-act=\"step\"]');\n      if (stepBtn) stepBtn.disabled = step >= total;\n    }\n    function go(n) { step = Math.max(0, Math.min(total, n)); render(); }\n    function stop() { if (timer) { clearInterval(timer); timer = null; } }\n    function run() {\n      stop();\n      if (step >= total) go(0);\n      timer = setInterval(function () { if (step >= total) { stop(); return; } go(step + 1); }, opts.interval || 1400);\n    }\n    root.querySelector('[data-act=\"run\"]').addEventListener('click', run);\n    root.querySelector('[data-act=\"step\"]').addEventListener('click', function () { stop(); go(step + 1); });\n    root.querySelector('[data-act=\"reset\"]').addEventListener('click', function () { stop(); go(0); });\n    render();\n    return { reset: function () { stop(); go(0); }, root: root };\n  }\n  function setLog(root, step) {\n    root.querySelectorAll('.logline').forEach(function (l) {\n      var s = +l.getAttribute('data-step');\n      l.classList.toggle('active', s === step);\n      l.classList.toggle('past', s < step);\n    });\n  }\n\n  /* ---------- agent loop demo ---------- */\n  // step → active node: 2=gather,3=action,4=verify(fail),5=gather+action,6=verify(pass)\n  var loopDemo = makeDemo('loopDemo', 7, function (root, step) {\n    setLog(root, step);\n    var nodes = { gather: root.querySelector('[data-node=\"gather\"]'), action: root.querySelector('[data-node=\"action\"]'), verify: root.querySelector('[data-node=\"verify\"]') };\n    Object.keys(nodes).forEach(function (k) { nodes[k].classList.remove('on'); });\n    var gate = root.querySelector('#gate');\n    var gtext = root.querySelector('#gatetext');\n    var gicon = gate.querySelector('.gicon');\n    var active = { 2: 'gather', 3: 'action', 4: 'verify', 5: 'action', 6: 'verify' }[step];\n    if (step === 5) { nodes.gather.classList.add('on'); }\n    if (active) nodes[active].classList.add('on');\n    // counters\n    var loops = step >= 6 ? 2 : (step >= 2 ? 1 : 0);\n    var tools = { 0:0,1:0,2:1,3:2,4:3,5:5,6:6,7:6 }[step];\n    var apis  = { 0:0,1:0,2:1,3:2,4:3,5:5,6:6,7:6 }[step];\n    root.querySelector('#loopcount').textContent = loops;\n    root.querySelector('#toolcount').textContent = tools;\n    root.querySelector('#apicount').textContent = apis;\n    // gate\n    gate.classList.remove('done');\n    if (step === 4) { gicon.textContent = '✕'; gtext.textContent = '아직 목표 미달 — 다시 루프'; }\n    else if (step >= 7) { gate.classList.add('done'); gicon.textContent = '✓'; gtext.textContent = '목표 달성 — 루프 종료'; }\n    else if (step === 6) { gate.classList.add('done'); gicon.textContent = '✓'; gtext.textContent = '검증 통과'; }\n    else { gicon.textContent = '?'; gtext.textContent = step === 0 ? '대기 중' : '목표 달성 여부를 확인 중…'; }\n  });\n\n  /* ---------- cost calculator ---------- */\n  (function () {\n    var root = document.getElementById('calc');\n    if (!root) return;\n    var PRICES = { haiku: [1, 5], sonnet: [3, 15], opus: [5, 25] }; // $ per MTok [in,out]\n    var state = { model: 'sonnet', inTok: 10000, outTok: 2000, cache: false, batch: false };\n    var fmt = function (n) { return n.toLocaleString('en-US'); };\n    function money(n) {\n      if (n >= 1) return n.toFixed(2);\n      if (n >= 0.01) return n.toFixed(4);\n      return n.toFixed(5);\n    }\n    function compute() {\n      var p = PRICES[state.model];\n      var inMult = state.cache ? 0.1 : 1;      // cache read ≈ 10% of input\n      var mult = state.batch ? 0.5 : 1;         // batch = 50%\n      var inCost = state.inTok / 1e6 * p[0] * inMult * mult;\n      var outCost = state.outTok / 1e6 * p[1] * mult;\n      return { inCost: inCost, outCost: outCost, total: inCost + outCost };\n    }\n    function render() {\n      // model buttons\n      root.querySelectorAll('.mp').forEach(function (b) { b.classList.toggle('sel', b.getAttribute('data-model') === state.model); });\n      root.querySelectorAll('.tog').forEach(function (t) { t.classList.toggle('on', state[t.getAttribute('data-tog')]); });\n      root.querySelector('#inv').textContent = fmt(state.inTok) + ' 토큰';\n      root.querySelector('#outv').textContent = fmt(state.outTok) + ' 토큰';\n      var c = compute();\n      root.querySelector('#rcost').textContent = money(c.total);\n      root.querySelector('#rk1000').textContent = '$' + money(c.total * 1000).replace(/^(\\d+\\.\\d{2}).*$/, '$1');\n      root.querySelector('#legin').textContent = '$' + money(c.inCost);\n      root.querySelector('#legout').textContent = '$' + money(c.outCost);\n      var pin = c.total > 0 ? (c.inCost / c.total * 100) : 50;\n      root.querySelector('#segin').style.width = pin + '%';\n      root.querySelector('#segout').style.width = (100 - pin) + '%';\n      // savings note vs standard sonnet-like base (no discounts, same model)\n      var p = PRICES[state.model];\n      var base = state.inTok / 1e6 * p[0] + state.outTok / 1e6 * p[1];\n      var save = base > 0 ? Math.round((1 - c.total / base) * 100) : 0;\n      var note = root.querySelector('#savenote');\n      note.textContent = save > 0 ? ('할인 미적용 대비 ' + save + '% 절감') : '';\n    }\n    root.querySelectorAll('.mp').forEach(function (b) { b.addEventListener('click', function () { state.model = b.getAttribute('data-model'); render(); }); });\n    root.querySelectorAll('.tog').forEach(function (t) { t.addEventListener('click', function () { var k = t.getAttribute('data-tog'); state[k] = !state[k]; render(); }); });\n    root.querySelector('#inrange').addEventListener('input', function (e) { state.inTok = +e.target.value; render(); });\n    root.querySelector('#outrange').addEventListener('input', function (e) { state.outTok = +e.target.value; render(); });\n    render();\n  })();\n\n  /* ---------- reset loop demo when its slide leaves ---------- */\n  [loopDemo].forEach(function (dm) {\n    if (!dm || !dm.root) return;\n    var sec = dm.root.closest('section');\n    if (!sec) return;\n    new MutationObserver(function () {\n      if (!sec.hasAttribute('data-deck-active')) dm.reset();\n    }).observe(sec, { attributes: true, attributeFilter: ['data-deck-active'] });\n  });\n})();\n\n/* auto-number footers + eyebrow counters from slide order */\n(function () {\n  var slides = document.querySelectorAll('deck-stage > section');\n  var total = slides.length;\n  slides.forEach(function (s, i) {\n    var p = s.querySelector('.pageno');\n    if (p) p.innerHTML = String(i + 1).padStart(2, '0') + '<span class=\"total\"> / ' + total + '<\u002Fspan>';\n  });\n  var sc = document.querySelector('.cover .meta span:last-child');\n  if (sc) sc.textContent = total + ' SLIDES';\n  var counts = {};\n  document.querySelectorAll('deck-stage > section .eyebrow .num').forEach(function (num) {\n    var eye = num.closest('.eyebrow');\n    var key = (eye.textContent || '').replace(num.textContent, '').split('·')[0].trim();\n    counts[key] = (counts[key] || 0) + 1;\n    num.textContent = String(counts[key]).padStart(2, '0');\n  });\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
